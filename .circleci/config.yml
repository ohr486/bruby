version: 2.1

orbs:
  slack: circleci/slack@4.9.3

jobs:
  test:
    docker:
      - image: erlang:28
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Build
          command: make
      - run:
          name: Test
          command: make ci
      - slack/notify:
          event: always

workflows:
  test:
    jobs:
      - test:
          context: ohr486-circleci-notification
